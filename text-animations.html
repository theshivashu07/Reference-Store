
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Wave Text</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  
    <!-- bootstrap link and script -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"

    />

    <!-- bootstrap and fontawesome icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Berkshire+Swash&family=Cinzel:wght@400..900&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Geist:ital,wght@0,100..900;1,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- Sabhi top Serif Fonts ka Single Combined Link -->
    <link href="https://googleapis.com" rel="stylesheet" />

    <!-- tailwinds css -->
    <script src="https://cdn.tailwindcss.com"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Berkshire+Swash&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Cinzel:wght@400..900&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Geist:ital,wght@0,100..900;1,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Ruwudu:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque" !important;

      
  font-family: "Bricolage Grotesque", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f3f4f2;
      color: #090909;
      font-family: "Inter", Arial, sans-serif;
      font-family: "Bricolage Grotesque" !important;
    }

    .hero {
      width: min(1400px, 100%);
      margin: 50px;
      /* padding: 150px 12%; */
    }

    .wave-heading {
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      font-size: clamp(3.2rem, 8.2vw, 7.4rem);
      font-weight: 430;
      line-height: 0.98;
      /* letter-spacing: -0.075em; */
      /* letter-spacing: -0.075em; */
      overflow-wrap: anywhere;
    }

    .wave-char {
      display: inline-block;
      font-weight: 430;

      transform-origin: center bottom;

      animation-name: character-weight-wave;
      animation-duration: var(--wave-cycle, 2400ms);
      animation-delay: calc(
        var(--char-index, 0) * var(--wave-step, 64ms)
      );
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-fill-mode: both;

      will-change: font-weight, transform;
    }

    @keyframes character-weight-wave {
      0%, 100% {
        /* font-weight: 430; */
        font-weight: 400;
        transform: translateY(0) scaleY(1);
      }

      33% {
        /* font-weight: 900; */
        font-weight: 800;
        transform: translateY(-0.01em) scaleY(1);
      }

      60% {
        /* font-weight: 430; */
        font-weight: 400;
        transform: translateY(0) scaleY(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave-char {
        animation: none;
        font-weight: 650;
        transform: none;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 100px 22px;
      }

      .wave-heading {
        font-size: clamp(3rem, 13vw, 5rem);
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- Change this text to your own name -->
     <h2 style="background-color: #e06536; font-size: 2.5rem; width: fit-content; color: white; padding: 1rem;">
        <!-- A product designer -->
        A senior full-stack AI Engineer
     </h2>
    <h1
      class="wave-heading"
      data-wave-heading
      data-text="jamming with code and AI"
      aria-label="jamming with code and AI"
    >
      <!-- data-text="Shivam Shukla" -->
      <!-- aria-label="Shivam Shukla" -->
      <span
        data-wave-visual
        aria-hidden="true"
      ></span>
    </h1>

  </main>

  <script>
    (() => {
      const headings = document.querySelectorAll(
        "[data-wave-heading]"
      );

      headings.forEach((heading) => {

        const visual = heading.querySelector(
          "[data-wave-visual]"
        );

        if (!visual) return;

        const text = heading.dataset.text ??
          heading.textContent.trim();

        // const stepMs =
        //   Number(heading.dataset.waveStep) || 64;

        const stepMs =
          Number(heading.dataset.waveStep) || 150;

        const pulseMs =
          Number(heading.dataset.wavePulse) || 420;

        // Split text into individual characters.
        const graphemes = typeof Intl.Segmenter === "function"
          ? Array.from(
              new Intl.Segmenter(undefined, {
                granularity: "grapheme"
              }).segment(text),
              item => item.segment
            )
          : Array.from(text);

        // Calculate the complete animation cycle.
        const cycleMs = Math.max(
          1800,
          graphemes.length * stepMs + pulseMs
        );

        heading.style.setProperty(
          "--wave-cycle",
          `${cycleMs}ms`
        );

        heading.style.setProperty(
          "--wave-step",
          `${stepMs}ms`
        );

        visual.replaceChildren();

        graphemes.forEach((character, index) => {

          // Preserve spaces and responsive line wrapping.
          if (/\s/.test(character)) {
            visual.appendChild(
              document.createTextNode(character)
            );
            return;
          }

          const span = document.createElement("span");

          span.className = "wave-char";

          span.style.setProperty(
            "--char-index",
            index
          );

          span.textContent = character;

          visual.appendChild(span);
        });

      });
    })();
  </script>

    <!-- bootstrap link and script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
